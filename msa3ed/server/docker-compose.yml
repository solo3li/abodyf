version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: uis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: uisdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: uis_app
    restart: always
    ports:
      - "5035:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=uisdb;Username=postgres;Password=postgres_password
    depends_on:
      - db

volumes:
  postgres_data:
